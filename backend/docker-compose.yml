services:
  backend:
    build: .
    container_name: what2do_backend
    ports:
      - "3333:3000"
    env_file:
      - .env

  what2do_db:
    image: mongo
    volumes:
      - mongo-config:/data/configdb
      - mongo-data:/data/db
    ports:
      - "28017:27017"
    expose:
      - "27017"
    container_name: "what2do_database"
volumes:
  mongo-config:
  mongo-data:
