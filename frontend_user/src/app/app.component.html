<ion-app>
  <ion-header>
    <ion-toolbar
      style="
        min-height: 56px;
        max-height: 80px;
        height: auto;
        color: var(--color-background);
      "
    >
      @if (toolbarService.showBackButton()) {

      <ion-buttons slot="start">
        <ion-icon
          name="arrow-back-outline"
          style="
            min-width: 24px;
            min-height: 24px;
            max-width: 48px;
            max-height: 48px;
            color: var(--ion-color-primary);
            cursor: pointer;
          "
          (click)="onBackClick()"
        ></ion-icon>
      </ion-buttons>
      }
      <img
        src="assets/logo.png"
        alt="Logo"
        class="logo-img"
        style="
          max-height: 32px;
          width: auto;
          position: absolute;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
        "
      />
      @if (isLoggedIn) {

      <ion-buttons slot="end">
        <ion-icon
          name="log-out-outline"
          style="
            min-width: 24px;
            min-height: 24px;
            max-width: 48px;
            max-height: 48px;
            color: var(--ion-color-primary);
            cursor: pointer;
            padding-right: 15px;
          "
          (click)="logout()"
        ></ion-icon>
      </ion-buttons>
      }
    </ion-toolbar>
  </ion-header>
  <ion-router-outlet></ion-router-outlet>
</ion-app>
